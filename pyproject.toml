[project]
name = "aggregator"
version = "0.1.0"
description = "Universal price-list aggregator backend"
readme = "docs/ARCHITECTURE_AND_SETUP.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "PyYAML>=6.0.0",
]

[project.scripts]
aggregator = "aggregator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aggregator"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
